# Experiment: 3B Model with 5 Agents
# Matches exp_5_agents (1.5B) to test population effect at 3B

experiment:
  name: "exp_3b_5_agents"
  description: "3B model with 5 agents population"
  output_dir: "results/exp_3b_5_agents"

model:
  path: "models/qwen2.5-coder-3b-instruct-q4_k_m.gguf"
  context_length: 4096
  max_tokens: 512
  temperature: 0.7
  top_p: 0.95

agents:
  n_agents: 5  # 5 AGENTS - matches exp_5_agents
  max_context_examples: 5

router:
  type: "affinity"
  temperature: 0.3

tasks:
  n_tasks: 164
  task_types:
    - string
    - math
    - list
    - logic

execution:
  timeout: 10

metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000

prompts:
  system: |
    You are a Python coding assistant. Write clean, correct code that solves the problem.
    Only output the function implementation, no explanations or extra text.

random_seed: 42
