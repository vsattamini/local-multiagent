# Mechanism A: type-filtered context + large buffer, on 3B.
# Low router temp concentrates routing -> agents accumulate type-homogeneous
# experience; type-filtered retrieval feeds an agent its OWN same-type examples
# as few-shot. Tests whether accumulated relevant experience induces GENUINE
# per-type success differences (LR test), not just routing concentration.
experiment:
  name: "mech_3b_typefilter"
  description: "3B, type-filtered context (K=20, show 5), router temp 0.1"
  output_dir: "results/mech_3b_typefilter"

model:
  path: "models/qwen2.5-coder-3b-instruct-q4_k_m.gguf"
  context_length: 4096
  max_tokens: 512
  generation_temperature: 0.2
  generation_top_p: 0.95

agents:
  n_agents: 3
  max_context_examples: 20        # large buffer to retain many same-type examples
  context_retrieval: "type_filtered"
  context_show: 5                  # show up to 5 same-type examples

router:
  type: "affinity"
  temperature: 0.1

tasks:
  n_tasks: 164
  task_types: [string, math, list, logic]

execution:
  timeout: 5

metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000

prompts:
  system: |
    You are a Python coding assistant. Write clean, correct code that solves the problem.
    Only output the function implementation, no explanations or extra text.

random_seed: 42
