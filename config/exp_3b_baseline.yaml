# Experiment: 3B Model Baseline (High Temp)
# Matches exp2.1_experimental (1.5B baseline) for proper comparison

experiment:
  name: "exp_3b_baseline"
  description: "3B model baseline with high temp (0.5) - matches 1.5B baseline"
  output_dir: "results/exp_3b_baseline"

model:
  path: "models/qwen2.5-coder-3b-instruct-q4_k_m.gguf"
  context_length: 4096
  max_tokens: 512
  temperature: 0.7
  top_p: 0.95

agents:
  n_agents: 3
  max_context_examples: 5

router:
  type: "affinity"
  temperature: 0.5  # HIGH TEMP - matches 1.5B baseline

tasks:
  n_tasks: 164
  task_types:
    - string
    - math
    - list
    - logic

execution:
  timeout: 10

metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000

prompts:
  system: |
    You are a Python coding assistant. Write clean, correct code that solves the problem.
    Only output the function implementation, no explanations or extra text.

random_seed: 42
