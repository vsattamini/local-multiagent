# Mechanism B (POSITIVE CONTROL): explicit persona prompts assign each agent a
# task-type specialty (Riedl's lever). This deliberately INDUCES differentiation.
# Purpose: validity anchor — if even explicit personas do NOT produce an
# LR-significant per-type success difference, the null LR result reflects the
# task/model ceiling, not a measurement failure. If they DO, the emergent
# (no-persona) null is a meaningful negative result.
experiment:
  name: "mech_1_5b_rrpersona"
  description: "3B, 4 personas + ROUND-ROBIN routing (balanced exposure, LR-computable positive control)"
  output_dir: "results/mech_1_5b_rrpersona"

model:
  path: "models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
  context_length: 4096
  max_tokens: 512
  generation_temperature: 0.2
  generation_top_p: 0.95

agents:
  n_agents: 4
  max_context_examples: 5
  personas:
    - |
      You are a Python specialist in STRING manipulation, parsing, and text formatting.
      Write clean, correct code. Only output the function implementation.
    - |
      You are a Python specialist in MATHEMATICS, arithmetic, and numeric algorithms.
      Write clean, correct code. Only output the function implementation.
    - |
      You are a Python specialist in LIST and array data-structure operations.
      Write clean, correct code. Only output the function implementation.
    - |
      You are a Python specialist in LOGIC, conditionals, and boolean validation.
      Write clean, correct code. Only output the function implementation.

router:
  type: "round_robin"
  temperature: 0.3

tasks:
  n_tasks: 164
  task_types: [string, math, list, logic]

execution:
  timeout: 5

metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000

prompts:
  system: |
    You are a Python coding assistant. Write clean, correct code that solves the problem.
    Only output the function implementation, no explanations or extra text.

random_seed: 42
