experiment:
  name: ens_3b_n3
  description: Homogeneous ENSEMBLE control (3x3B, n-matched to het_swarm_ensemble).
    Differs from het_swarm_ensemble ONLY in agent weights -> isolates heterogeneity
    as the cause of any LR signal.
  output_dir: results/ens_3b_n3
model:
  path: models/qwen2.5-coder-3b-instruct-q4_k_m.gguf
  context_length: 4096
  max_tokens: 512
  generation_temperature: 0.2
  generation_top_p: 0.95
agents:
  n_agents: 3
  max_context_examples: 20
  context_retrieval: type_filtered
  context_show: 5
  ensemble_assignment: all
router:
  type: round_robin
  temperature: 0.3
tasks:
  n_tasks: 164
  task_types:
  - string
  - math
  - list
  - logic
  benchmark: humaneval
execution:
  timeout: 10
  decouple_decode_seed: true
  clean_mode: strict
metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000
prompts:
  system: You are a Python coding assistant. Write clean, correct code that solves
    the problem. Only output the function implementation, no explanations or extra
    text.
random_seed: 42
