experiment:
  name: popN_12
  description: Large-N population n_agents=12 (1.5B) — robust S(N) curve
  output_dir: results/popN_12
model:
  path: models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
  context_length: 4096
  max_tokens: 512
  generation_temperature: 0.2
  generation_top_p: 0.95
agents:
  n_agents: 12
  max_context_examples: 20
  context_retrieval: type_filtered
  context_show: 5
router:
  type: affinity
  temperature: 0.1
tasks:
  n_tasks: 164
  task_types:
  - string
  - math
  - list
  - logic
  benchmark: humaneval
execution:
  timeout: 5
  decouple_decode_seed: true
  clean_mode: strict
metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000
prompts:
  system: You are a Python coding assistant. Write clean, correct code that solves
    the problem. Only output the function implementation, no explanations or extra
    text.
random_seed: 42
