# Experiment: 7B baseline (router temp 0.5) — matches 1.5B/3B baselines
experiment:
  name: "exp_7b_baseline"
  description: "7B baseline, high router temp (0.5)"
  output_dir: "results/exp_7b_baseline"

model:
  path: "models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
  context_length: 4096
  max_tokens: 512
  generation_temperature: 0.2   # actual decoding temperature (explicit)
  generation_top_p: 0.95

agents:
  n_agents: 3
  max_context_examples: 5

router:
  type: "affinity"
  temperature: 0.5   # HIGH router temp (baseline)

tasks:
  n_tasks: 164
  task_types: [string, math, list, logic]

execution:
  timeout: 10

metrics:
  snapshot_interval: 10
  compute_significance: true
  n_permutations: 1000

prompts:
  system: |
    You are a Python coding assistant. Write clean, correct code that solves the problem.
    Only output the function implementation, no explanations or extra text.

random_seed: 42
